[package]
name = "fkbox-android"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "FK-box Android shell: android_main, the JNI links to the Kotlin host (UI calls, client store), logcat setup and the presentation controllers (navigation, rows, pages) that drive the Slint UI (fkbox-client-ui)."

# libfkui.so, the library BoxActivity loads (android.app.lib_name = fkui).
# The rlib is for the host screenshot harness (examples/shot.rs) only.
[lib]
name = "fkui"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
fkbox-client-core = { workspace = true }
fkbox-mobile-ffi = { workspace = true }
fkbox-client-ui = { workspace = true }
slint = { workspace = true }
# The client store's JNI surface (src/jni_store.rs) builds on every target, so it
# is checked off Android too.
jni = { workspace = true }
serde_json = { workspace = true }
# QrCodeView (ui/QrCode.kt), ZXing Encoder at level L.
qrcodegen = "1.8"
# App icons are decoded here, not through slint::Image::load_from_path, whose
# process-wide path cache kept up to 5 MB of icons after the app list closed.
png = "0.18"
# The harness loads fontconfig at run time (no headers needed to build it).
i-slint-common = { version = "=1.19.0", optional = true, features = ["fontconfig-dlopen"] }

[features]
# Host-only screenshot harness (src/shot.rs, examples/shot.rs): the software renderer
# draws the pages at phone size from fixture data, for visual checks without a device.
shot = ["slint/renderer-software", "dep:i-slint-common"]
# The harness drawing with the (vendored) Skia renderer instead, rasterized on the CPU:
# the renderer Android uses (SHOT_RENDERER=skia).
shot-skia = ["shot", "dep:i-slint-renderer-skia"]

[[example]]
name = "shot"
required-features = ["shot"]

[target.'cfg(target_os = "android")'.dependencies]
i-slint-backend-android-activity = { version = "=1.19.0", features = ["aa-06", "game-activity"] }
log = "0.4"
android_logger = "0.15"
# The Skia renderer the backend draws with (vendored, see [patch.crates-io]):
# its FK-box purge hook releases caches when an image-heavy page closes.
i-slint-renderer-skia = { version = "=1.19.0", default-features = false }
i-slint-core = { version = "=1.19.0", default-features = false, features = ["std", "image-decoders", "shared-parley"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
i-slint-core = { version = "=1.19.0", default-features = false, features = ["std", "image-decoders", "svg", "shared-parley"] }
i-slint-renderer-skia = { version = "=1.19.0", default-features = false, optional = true }
