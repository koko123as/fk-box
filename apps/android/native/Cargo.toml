[package]
name = "fkbox-android"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "FK-box Android shell: android_main, the JNI links to the Kotlin host (UI calls, client store) and logcat setup, around the Slint UI (fkbox-client-ui)."

# libfkui.so, the library BoxActivity loads (android.app.lib_name = fkui).
[lib]
name = "fkui"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
fkbox-client-core = { workspace = true }
fkbox-client-ui = { workspace = true }
slint = { workspace = true }
# The client store's JNI surface (src/store.rs) builds on every target, so it
# is checked off Android too.
jni = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
i-slint-backend-android-activity = { version = "=1.19.0", features = ["aa-06", "game-activity"] }
log = "0.4"
android_logger = "0.15"
