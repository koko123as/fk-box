# Geo data for Xray and mihomo (see docs/libbox.md "地理数据", docs/app.md "地理数据资源").
# Pinned to a commit of the meta-rules-dat release branch and checked against
# these SHA-256 sums; the files are never committed. Only the resources in
# GEO_BUNDLED are downloaded by the prepare*GeoAssets Gradle task and shipped
# in assets/geo; the others are listed in the manifest with their pinned URL
# and hash, and the app downloads them when a core first needs them.
# Update with: python3 scripts/bump_geo_assets.py
GEO_REPOSITORY=MetaCubeX/meta-rules-dat
GEO_COMMIT=ae128ce26d85ee327379a837d0f3bbab5556d3ae
# Commit time of GEO_COMMIT (UTC); an installed file older than this is
# replaced by the bundled copy, a newer download never is.
GEO_TIME=2026-11-06T02:42:00Z
# Shipped in the APK: geosite.dat (Xray and mihomo GEOSITE) and geoip.metadb
# (mihomo GEOIP). geoip.dat (Xray only, the same IP data as geoip.metadb) and
# ASN.mmdb (mihomo IP-ASN only) are downloaded on first use.
GEO_BUNDLED=geosite,mmdb
# <resource>=<source file in the repository>:<installed file name>:<sha256>
geoip=geoip.dat:geoip.dat:90b78ab861c1cdc3f871f305f9ceedfb8d6d6329e3a40295e6773e057297384c
geosite=geosite.dat:geosite.dat:e4fa530c3f58593e78d20edf6563947a4257d1903e741871cacffc5a8a09d706
mmdb=geoip.metadb:geoip.metadb:bcd87b9d2ec40d3264032f7f6381650a100300fdc94d5e574913d0513eb13779
asn=GeoLite2-ASN.mmdb:ASN.mmdb:3f729dfdbca46d6bc83fe084e15e335cef702b46f9d9afb8feaede36180959f4
