[package]
name = "fkrustcb"
version = "0.0.0"
edition = "2021"
publish = false
description = "fk-box stage-0 probe: C-ABI decide callback for Go (cgo)"

# Standalone: not a member of the repository's root Cargo workspace.
[workspace]

[lib]
crate-type = ["staticlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
