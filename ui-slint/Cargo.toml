[package]
name = "fkui"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "FK-box user interface in Rust + Slint; the Go cores and the Kotlin service layer are reused unchanged."

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# No default backends: on Android the platform is the GameActivity backend below.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
i-slint-backend-android-activity = { version = "=1.18.1", features = ["aa-06", "game-activity"] }
jni = "0.21"
log = "0.4"
android_logger = "0.15"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
