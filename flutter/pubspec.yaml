name: fk_box_ui
description: FK-box Android interface, using FlClash presentation and sing-box services.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: 1.19.1
  super_sliver_list: 0.4.1
  mobile_scanner: 7.4.2
  prism_ui:
    path: packages/prism_ui
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: Twemoji
      fonts:
        - asset: assets/fonts/Twemoji.Mozilla.ttf
  module:
    androidX: true
    androidPackage: io.fkbox.ui
    iosBundleIdentifier: io.fkbox.ui
