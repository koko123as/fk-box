name: Build fk-box libbox
description: Build the patched Android core with the upstream Java and NDK versions.

inputs:
  platform:
    description: Android target platform (android/arm64 only).
    required: true

outputs:
  version:
    description: Version used to build the core.
    value: ${{ steps.inputs.outputs.version }}
  cache-hit:
    description: '"true" when libbox.aar came from the Actions cache.'
    value: ${{ steps.aar.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # libbox.aar depends only on the core tag, the Go/Xray/mihomo pins, the
    # fk-box core module under apps/android/core/ (sources, patches, go.mod and
    # go.sum), the patch scripts and these two actions (NDK, gomobile steps). The app's VERSION_NAME/CODE are not part
    # of it, so a release that only bumps them reuses the cached AAR.
    - id: inputs
      name: Key the libbox inputs
      shell: bash
      env:
        LIBBOX_PLATFORM: ${{ inputs.platform }}
      run: |
        version=$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '\r')
        core_version=$(sed -n 's/^CORE_VERSION=//p' version.properties | tr -d '\r')
        core_version=${core_version:-$version}
        deps=$(printf 'core=%s\n' "$core_version"; grep -E '^(GO_VERSION|XRAY_VERSION|XRAY_MODULE_VERSION|MIHOMO_VERSION|LIBXRAY_MODULE_VERSION)=' version.properties | tr -d '\r' | sort)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "deps_key=$(printf '%s' "$deps" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
        echo "platform=${LIBBOX_PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
    - id: aar
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: apps/android/app/libs/libbox.aar
        key: libbox-aar-${{ steps.inputs.outputs.platform }}-${{ steps.inputs.outputs.deps_key }}-${{ hashFiles('apps/android/core/**', 'tools/patch_*.py', '.github/actions/setup-core/action.yml', '.github/actions/build-libbox/action.yml') }}
    - id: core
      if: steps.aar.outputs.cache-hit != 'true'
      uses: ./.github/actions/setup-core
      with:
        cache-purpose: libbox-${{ steps.inputs.outputs.platform }}
    # The upstream libbox builder explicitly requires OpenJDK 17.
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        log-accepted-android-sdk-licenses: false
        packages: >-
          platform-tools
          platforms;android-36
          platforms;android-37.1
          build-tools;36.0.0
          build-tools;37.0.0
          ndk;28.0.13004108
          ndk;28.2.13676358
          ndk;30.0.16248370
    # gomobile binds sing-box's libbox package (with the fk-box sources) from
    # the fk-box core module, apps/android/core, so the module set is the one
    # committed in its go.mod/go.sum. Flags and tags follow sing-box's
    # cmd/internal/build_libbox (Android, no legacy variant), plus cmfa: mihomo
    # is embedded the way ClashMetaForAndroid embeds it (the app supplies
    # system DNS, and no package-list reader needs root).
    - name: Build Android libbox
      if: steps.aar.outputs.cache-hit != 'true'
      shell: bash
      working-directory: apps/android/core
      env:
        LIBBOX_PLATFORM: ${{ inputs.platform }}
        GOTOOLCHAIN: local
      run: |
        case "$LIBBOX_PLATFORM" in
          android/arm64) ;;
          *) echo "Unsupported Android platform: $LIBBOX_PLATFORM" >&2; exit 1 ;;
        esac
        java --version 2>&1 | grep 'openjdk 17'
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
        test -f "$ANDROID_NDK_HOME/source.properties"
        export ANDROID_SDK_HOME="$ANDROID_HOME" NDK="$ANDROID_NDK_HOME"
        export PATH="$PATH:$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
        make -C ../../../.core lib_install
        export PATH="$PATH:$(go env GOPATH)/bin"
        tags=with_quic,with_wireguard,with_utls,with_naive_outbound,with_clash_api,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0,with_tailscale,ts_omit_logtail,ts_omit_ssh,ts_omit_drive,ts_omit_taildrop,ts_omit_webclient,ts_omit_doctor,ts_omit_capture,ts_omit_kube,ts_omit_aws,ts_omit_synology,ts_omit_bird
        # Fail when sing-box's own Android tag list no longer matches.
        upstream=$(sed -n 's/^\s*sharedTags = append(sharedTags, \(.*\))$/\1/p' ../../../.core/cmd/internal/build_libbox/main.go | tr -d '" ' | paste -sd, -)
        test "$upstream" = "$tags"
        tags="$tags,cmfa"
        # Version string as sing-box's build_shared.ReadTag gives it.
        core_tag=$(git -C ../../../.core describe --tags 2>/dev/null || true)
        core_rev=$(git -C ../../../.core describe --tags --abbrev=0 2>/dev/null || true)
        if [ -z "$core_tag" ]; then
          core_version=unknown
        elif [ "$core_tag" = "$core_rev" ]; then
          core_version=${core_tag#v}
        else
          core_version=${core_rev#v}-$(git -C ../../../.core rev-parse --short HEAD)
        fi
        echo "libbox version: $core_version"
        out="$RUNNER_TEMP/libbox"
        rm -rf "$out" && mkdir -p "$out"
        gomobile bind -v -o "$out/libbox.aar" -target "$LIBBOX_PLATFORM" -androidapi 24 \
          -javapkg=io.nekohasekai -libname=box -trimpath -buildvcs=false \
          -ldflags "-X github.com/sagernet/sing-box/constant.Version=$core_version -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid=" \
          -tags "$tags" github.com/sagernet/sing-box/experimental/libbox
        mkdir -p ../app/libs
        cp "$out/libbox.aar" ../app/libs/libbox.aar
        size=$(stat -c %s ../app/libs/libbox.aar)
        so=$(unzip -l ../app/libs/libbox.aar | awk '/libbox\.so/ {print $1}')
        echo "libbox.aar: $size bytes, jni/arm64-v8a/libbox.so: $so bytes"
        {
          echo "### libbox (sing-box + Xray + mihomo)"
          echo "- libbox.aar: $size bytes"
          echo "- libbox.so (arm64-v8a): $so bytes"
        } >> "$GITHUB_STEP_SUMMARY"
    # Saved right after the build, so a later app failure still keeps it.
    - if: steps.aar.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: apps/android/app/libs/libbox.aar
        key: ${{ steps.aar.outputs.cache-primary-key }}
    - name: Report the cached libbox
      if: steps.aar.outputs.cache-hit == 'true'
      shell: bash
      run: |
        size=$(stat -c %s apps/android/app/libs/libbox.aar)
        so=$(unzip -l apps/android/app/libs/libbox.aar | awk '/libbox\.so/ {print $1}')
        echo "libbox.aar from cache ${{ steps.aar.outputs.cache-matched-key }}: $size bytes, libbox.so: $so bytes"
        {
          echo "### libbox (sing-box + Xray + mihomo), cached"
          echo "- key: ${{ steps.aar.outputs.cache-matched-key }}"
          echo "- libbox.aar: $size bytes"
          echo "- libbox.so (arm64-v8a): $so bytes"
        } >> "$GITHUB_STEP_SUMMARY"
    # The Rust + Slint UI (libfkui.so) links Slint 1.19's prebuilt Skia, which
    # is built with NDK r30 and needs its static libc++ (std::__ndk1::__hash_memory
    # is missing from r28's, and the library then fails to load on the device).
    # apps/android/app/build.gradle.kts gives FKUI_NDK_HOME to cargo-ndk; the core and the
    # app's own native packaging keep NDK 28.
    - name: Select the NDK for the Slint UI
      shell: bash
      run: |
        test -d "$ANDROID_HOME/ndk/30.0.16248370"
        echo "FKUI_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
