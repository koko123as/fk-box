name: Build fk-box libbox
description: Build the patched Android core with the upstream Java and NDK versions.

inputs:
  platform:
    description: Android target platform (android/arm64 only).
    required: true

outputs:
  version:
    description: Version used to build the core.
    value: ${{ steps.inputs.outputs.version }}
  cache-hit:
    description: '"true" when libbox.aar came from the Actions cache.'
    value: ${{ steps.aar.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # libbox.aar depends only on the core tag, the Go/Xray/mihomo pins, the
    # patches and Go extensions under core/, the patch scripts and these two
    # actions (NDK, gomobile steps). The app's VERSION_NAME/CODE are not part
    # of it, so a release that only bumps them reuses the cached AAR.
    - id: inputs
      name: Key the libbox inputs
      shell: bash
      env:
        LIBBOX_PLATFORM: ${{ inputs.platform }}
      run: |
        version=$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '\r')
        core_version=$(sed -n 's/^CORE_VERSION=//p' version.properties | tr -d '\r')
        core_version=${core_version:-$version}
        deps=$(printf 'core=%s\n' "$core_version"; grep -E '^(GO_VERSION|XRAY_VERSION|XRAY_MODULE_VERSION|MIHOMO_VERSION|LIBXRAY_MODULE_VERSION)=' version.properties | tr -d '\r' | sort)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "deps_key=$(printf '%s' "$deps" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
        echo "platform=${LIBBOX_PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
    - id: aar
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: clients/android/app/libs/libbox.aar
        key: libbox-aar-${{ steps.inputs.outputs.platform }}-${{ steps.inputs.outputs.deps_key }}-${{ hashFiles('core/**', 'tools/patch_*.py', '.github/actions/setup-core/action.yml', '.github/actions/build-libbox/action.yml') }}
    - id: core
      if: steps.aar.outputs.cache-hit != 'true'
      uses: ./.github/actions/setup-core
      with:
        cache-purpose: libbox-${{ steps.inputs.outputs.platform }}
    # The upstream libbox builder explicitly requires OpenJDK 17.
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        log-accepted-android-sdk-licenses: false
        packages: >-
          platform-tools
          platforms;android-36
          platforms;android-37.1
          build-tools;36.0.0
          build-tools;37.0.0
          ndk;28.0.13004108
          ndk;28.2.13676358
          ndk;30.0.16248370
    - name: Build Android libbox
      if: steps.aar.outputs.cache-hit != 'true'
      shell: bash
      working-directory: .core
      env:
        LIBBOX_PLATFORM: ${{ inputs.platform }}
      run: |
        case "$LIBBOX_PLATFORM" in
          android/arm64) ;;
          *) echo "Unsupported Android platform: $LIBBOX_PLATFORM" >&2; exit 1 ;;
        esac
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
        make lib_install
        libbox_go_bin="$(go env GOPATH)/bin"
        export PATH="$PATH:$libbox_go_bin"
        go run ./cmd/internal/build_libbox -target android -platform "$LIBBOX_PLATFORM"
        test ! -e libbox-legacy.aar
        mkdir -p ../clients/android/app/libs
        cp libbox.aar ../clients/android/app/libs/libbox.aar
        size=$(stat -c %s libbox.aar)
        so=$(unzip -l libbox.aar | awk '/libbox\.so/ {print $1}')
        echo "libbox.aar: $size bytes, jni/arm64-v8a/libbox.so: $so bytes"
        {
          echo "### libbox (sing-box + Xray + mihomo)"
          echo "- libbox.aar: $size bytes"
          echo "- libbox.so (arm64-v8a): $so bytes"
        } >> "$GITHUB_STEP_SUMMARY"
    # Saved right after the build, so a later app failure still keeps it.
    - if: steps.aar.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: clients/android/app/libs/libbox.aar
        key: ${{ steps.aar.outputs.cache-primary-key }}
    - name: Report the cached libbox
      if: steps.aar.outputs.cache-hit == 'true'
      shell: bash
      run: |
        size=$(stat -c %s clients/android/app/libs/libbox.aar)
        so=$(unzip -l clients/android/app/libs/libbox.aar | awk '/libbox\.so/ {print $1}')
        echo "libbox.aar from cache ${{ steps.aar.outputs.cache-matched-key }}: $size bytes, libbox.so: $so bytes"
        {
          echo "### libbox (sing-box + Xray + mihomo), cached"
          echo "- key: ${{ steps.aar.outputs.cache-matched-key }}"
          echo "- libbox.aar: $size bytes"
          echo "- libbox.so (arm64-v8a): $so bytes"
        } >> "$GITHUB_STEP_SUMMARY"
    # The Rust + Slint UI (libfkui.so) links Slint 1.19's prebuilt Skia, which
    # is built with NDK r30 and needs its static libc++ (std::__ndk1::__hash_memory
    # is missing from r28's, and the library then fails to load on the device).
    # clients/android/app/build.gradle.kts gives FKUI_NDK_HOME to cargo-ndk; the core and the
    # app's own native packaging keep NDK 28.
    - name: Select the NDK for the Slint UI
      shell: bash
      run: |
        test -d "$ANDROID_HOME/ndk/30.0.16248370"
        echo "FKUI_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
