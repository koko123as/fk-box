name: Prepare fk-box core
description: Check out the matching sing-box version and install all fk-box patches and bindings.

inputs:
  cache-purpose:
    description: >-
      Names the Go build cache. Callers that compile different things (host
      tests with -race, the gomobile Android build) keep separate caches so
      neither evicts the other's objects.
    required: false
    default: test

outputs:
  version:
    description: Core and application version from version.properties.
    value: ${{ steps.versions.outputs.version }}

runs:
  using: composite
  steps:
    - name: Read core and Go versions
      id: versions
      shell: bash
      run: |
        version=$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '\r')
        go_version=$(sed -n 's/^GO_VERSION=go//p' version.properties | tr -d '\r')
        core_version=$(sed -n 's/^CORE_VERSION=//p' version.properties | tr -d '\r')
        core_version=${core_version:-$version}
        [[ "$version" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]
        [[ "$go_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "go_version=$go_version" >> "$GITHUB_OUTPUT"
        echo "core_version=$core_version" >> "$GITHUB_OUTPUT"
        # The module set is fixed by the core tag and the pinned extra cores
        # (the app's own VERSION_NAME/CODE, rewritten for every release, is left out).
        deps=$(printf 'core=%s\n' "$core_version"; grep -E '^(GO_VERSION|XRAY_VERSION|XRAY_MODULE_VERSION|MIHOMO_VERSION|LIBXRAY_MODULE_VERSION)=' version.properties | tr -d '\r' | sort)
        echo "deps_key=$(printf '%s' "$deps" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        repository: SagerNet/sing-box
        ref: v${{ steps.versions.outputs.core_version }}
        path: .core
        persist-credentials: false
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ steps.versions.outputs.go_version }}
        # setup-go's own cache is keyed on the upstream go.sum only (the Xray,
        # mihomo and goja modules added below never changed its key) and has
        # no restore-keys; the module and build caches are handled below.
        cache: false
    - name: Locate the Go caches
      id: goenv
      shell: bash
      run: |
        echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "buildcache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
    # Saved once per module set (core tag, pinned cores, this file and
    # apps/android/core/go.sum); a newer set starts from the closest older cache. Go's build cache
    # is content-addressed, so objects restored from an older run are only
    # reused when their inputs match.
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ${{ steps.goenv.outputs.modcache }}
          ${{ steps.goenv.outputs.buildcache }}
        key: go-${{ runner.os }}-${{ inputs.cache-purpose }}-go${{ steps.versions.outputs.go_version }}-${{ steps.versions.outputs.deps_key }}-${{ hashFiles('.github/actions/setup-core/action.yml', 'apps/android/core/go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-${{ inputs.cache-purpose }}-go${{ steps.versions.outputs.go_version }}-${{ steps.versions.outputs.deps_key }}-
          go-${{ runner.os }}-${{ inputs.cache-purpose }}-go${{ steps.versions.outputs.go_version }}-
    - name: Apply patches and install bindings
      shell: bash
      run: |
        git -C .core apply --check ../apps/android/core/libbox-no-legacy.patch
        git -C .core apply ../apps/android/core/libbox-no-legacy.patch
        python3 tools/patch_sing_tun.py .core
        python3 tools/patch_httpdebug.py .core
        python3 tools/patch_multicore.py .core
        python3 tools/patch_dns_count.py .core
        cp apps/android/core/ui_*.go apps/android/core/core_*.go .core/experimental/libbox/
    - name: Check the core module
      shell: bash
      working-directory: apps/android/core
      # apps/android/core is its own Go module (go.mod/go.sum). It requires the
      # matching sing-box tag, replaced by the patched checkout above (.core,
      # with the fk-box libbox sources copied in), and pins Xray, libXray,
      # mihomo and goja; the Android build and the Go tests run from here. The
      # module set is committed, so nothing is resolved at build time.
      env:
        GOTOOLCHAIN: local
      run: |
        # The fk-box sources compile inside sing-box's libbox package, so the
        # sing-box module gets this module's language version.
        go_directive=$(go mod edit -json | jq -r .Go)
        go -C ../../../.core mod edit -go="$go_directive"
        core_version=${{ steps.versions.outputs.core_version }}
        xray=$(sed -n 's/^XRAY_MODULE_VERSION=//p' ../../../version.properties | tr -d '\r')
        libxray=$(sed -n 's/^LIBXRAY_MODULE_VERSION=//p' ../../../version.properties | tr -d '\r')
        mihomo=$(sed -n 's/^MIHOMO_VERSION=//p' ../../../version.properties | tr -d '\r')
        [[ "$libxray" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]
        [[ "$xray" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]
        [[ "$mihomo" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        # go.mod and go.sum must match the sources (fails when an import was
        # added or removed without go mod tidy).
        go mod tidy -diff
        test "$(go mod edit -json | jq -r '.Require[] | select(.Path=="github.com/sagernet/sing-box") | .Version')" = "v$core_version"
        test "$(go mod edit -json | jq -r '.Replace[] | select(.Old.Path=="github.com/sagernet/sing-box") | .New.Path')" = "../../../.core"
        test "$(go list -m -f '{{.Version}}' github.com/xtls/xray-core)" = "$xray"
        test "$(go list -m -f '{{.Version}}' github.com/xtls/libxray)" = "$libxray"
        test "$(go list -m -f '{{.Version}}' github.com/metacubex/mihomo)" = "v$mihomo"
        test "$(go list -m -f '{{.Version}}' github.com/dop251/goja)" = "v0.0.0-20261102223426-a177d211bf60"
        xray_reality=$(curl -fsSL "https://proxy.golang.org/github.com/xtls/xray-core/@v/$xray.mod" | awk '$1=="github.com/xtls/reality" {print $2}')
        test "$(go list -m -f '{{.Version}}' github.com/xtls/reality)" = "$xray_reality"
        # The core must stay on the sing-box module versions it was released with.
        upstream_sing=$(go mod edit -json ../../../.core/go.mod | jq -r '.Require[] | select(.Path=="github.com/sagernet/sing") | .Version')
        test "$(go list -m -f '{{.Version}}' github.com/sagernet/sing)" = "$upstream_sing"
        diff <(go mod edit -json ../../../.core/go.mod | jq -r '.Require[] | "\(.Path) \(.Version)"' | sort) \
             <(go mod edit -json | jq -r '.Require[] | select(.Path!="github.com/sagernet/sing-box") | "\(.Path) \(.Version)"' | sort) \
             | sed -n 's/^> //p' > ../../../core-module-bumps.txt || true
        {
          echo "Module requirements added or raised over sing-box $core_version by Xray $xray, libXray $libxray, mihomo v$mihomo and goja: $(wc -l < ../../../core-module-bumps.txt)"
          cat ../../../core-module-bumps.txt
        } | tee -a "$GITHUB_STEP_SUMMARY"
