name: Core and source validation

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 6b: the three-core libbox sources (apps/android/core, setup-core,
  # build-libbox) are gone; the kernel is fkhost (brain.yml, fkhost.yml and the
  # APK workflows). What stays here is the one kept sing-tun patch.
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Read Go version
        id: versions
        run: echo "go_version=$(sed -n 's/^GO_VERSION=go//p' version.properties | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.versions.outputs.go_version }}
          cache-dependency-path: apps/android/fkhost/go.sum
      # The kept sing-tun-android-ingress.patch (docs/architecture/brain-android.md):
      # applied to a scratch copy of the sing-tun fkhost pins, then its test.
      - name: Android ingress-discard map compatibility tests
        run: |
          python3 scripts/patch_sing_tun.py apps/android/fkhost
          cd apps/android/fkhost
          go test -ldflags=-checklinkname=0 github.com/sagernet/sing-tun -run '^TestAndroidIngressDiscard' -count=1 -v
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Compose source guards
        run: python3 scripts/verify_newui.py
