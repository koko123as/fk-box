name: Core and source validation

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-core
      - name: Multi-core gRPC coverage (every StartedService method handled or reviewed)
        run: python3 tools/verify_multicore.py
      - name: Android ingress-discard map compatibility tests
        working-directory: .core
        run: go test -ldflags=-checklinkname=0 github.com/sagernet/sing-tun -run '^TestAndroidIngressDiscard' -count=1
      - name: HTTP, routed IP and LAN tests against the matching core
        working-directory: .core
        run: go test -ldflags=-checklinkname=0 ./experimental/libbox -run '^TestUI' -count=1
      - name: Multi-core profile detection, conversion and validation tests
        working-directory: .core
        # with_quic: converted sing-box profiles carry Hysteria2 nodes.
        run: go test -tags with_quic,with_utls -ldflags=-checklinkname=0 ./experimental/libbox -run '^Test(DetectCoreConfig|Convert|CheckMihomo|CheckXray|ResolveProfileCore|SubscriptionURL|DropUnbuiltTunStack|ConvertCoreShareLinksEnabled|CoreProfileStats|CoreInternals|CoreConfigArray|CoreDefaultLogLevel|CoreGeo|CoreMemory)' -count=1 -v
      - name: HTTP/MITM, profile rewrite, JavaScript, storage and route tests
        working-directory: .core
        run: |
          go test -race ./experimental/httpdebug -count=1 -timeout=5m
          go test -ldflags=-checklinkname=0 ./route -run '^TestBboxHTTPDebug' -count=1 -timeout=5m
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Checkout FlClash reference
        uses: actions/checkout@v5
        with:
          repository: chen08209/FlClash
          ref: be84736605527034689c95bf27828ff27d912c5e
          path: .ref/FlClash
          persist-credentials: false
      - name: Checkout prism_ui reference
        uses: actions/checkout@v5
        with:
          repository: chen08209/prism_ui
          ref: 63450c0ac0e8e1b2c0f3ed4ad7926dc94e083185
          path: .ref/prism_ui
          persist-credentials: false
      # flutter/ must match FlClash v0.9.3 / prism_ui file by file except what
      # flclash-manifest.json lists (see flclash.md).
      - name: FlClash UI source diff
        run: |
          python3 tools/verify_flclash_ui.py .ref/FlClash .ref/prism_ui --report flclash-ui-diff.md
          cat flclash-ui-diff.md >> "$GITHUB_STEP_SUMMARY"
