name: Core and source validation

on:
  push:
    branches: [main]
    paths:
      # shared: everything the clients build on (keep in sync across build-*.yml / newui.yml)
      - 'core/**'
      - 'legacy/**'
      - 'protocol/**'
      - 'ui/**'
      - 'tools/**'
      - 'version.properties'
      - 'flclash-manifest.json'
      - 'licenses/**'
      - '.github/actions/**'
      - 'clients/**'
      - '.github/workflows/newui.yml'
      # docs-only changes never build
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      # shared: everything the clients build on (keep in sync across build-*.yml / newui.yml)
      - 'core/**'
      - 'legacy/**'
      - 'protocol/**'
      - 'ui/**'
      - 'tools/**'
      - 'version.properties'
      - 'flclash-manifest.json'
      - 'licenses/**'
      - '.github/actions/**'
      - 'clients/**'
      - '.github/workflows/newui.yml'
      # docs-only changes never build
      - '!**/*.md'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-core
      - name: Command service coverage (every StartedService method implemented by fk-box)
        run: python3 tools/verify_multicore.py
      - name: sing-box touchpoints (every sing-box/libbox symbol core/ uses is listed in core_touch_singbox.go)
        run: python3 tools/verify_touchpoints.py --core .core
      - name: fk-box entry package (experimental/fkbox, bound into libbox.aar) builds
        working-directory: .core
        run: |
          go build -ldflags=-checklinkname=0 ./experimental/fkbox
          # fk-box's Android build command (cmd/fk-bind, run by build-libbox).
          go vet ./cmd/fk-bind
      - name: fk-box host services (experimental/fkhost) tests
        working-directory: .core
        run: |
          go test ./experimental/fkhost -count=1
          # Platform files by build tag: every system's fkhost compiles.
          for os in windows darwin; do GOOS=$os GOARCH=amd64 CGO_ENABLED=0 go vet ./experimental/fkhost; done
      - name: Desktop core (fk-core, linux) builds and answers hello over stdio
        working-directory: .core
        run: |
          go build -trimpath -ldflags=-checklinkname=0 -o "$RUNNER_TEMP/fk-core" ./cmd/fk-core
          "$RUNNER_TEMP/fk-core" -version
          printf '%s\n' \
            '{"id":1,"method":"checkConfig","args":{"content":"{}"}}' \
            '{"id":2,"method":"hello","args":{"protocolVersion":1,"client":"ci","clientVersion":"0","capabilities":[]}}' \
            '{"id":3,"method":"formatConfig","args":{"content":"{\"log\":{}}"}}' \
            '{"id":4,"method":"listApps","args":{}}' \
            | "$RUNNER_TEMP/fk-core" -dir "$RUNNER_TEMP/fk-core-dir" | tee "$RUNNER_TEMP/fk-core.out"
          grep -q '"id":1,"error":"protocol: send hello first"' "$RUNNER_TEMP/fk-core.out"
          grep -q '"id":2,"result":{"protocolVersion":1' "$RUNNER_TEMP/fk-core.out"
          grep -q '"id":3,' "$RUNNER_TEMP/fk-core.out"
          grep -q '"id":4,"error":"listApps: answered by the client' "$RUNNER_TEMP/fk-core.out"
      - name: Android ingress-discard map compatibility tests
        working-directory: .core
        run: go test -ldflags=-checklinkname=0 github.com/sagernet/sing-tun -run '^TestAndroidIngressDiscard' -count=1
      - name: HTTP, routed IP and LAN tests against the matching core
        working-directory: .core
        run: go test -ldflags=-checklinkname=0 ./experimental/libbox -run '^TestUI' -count=1
      - name: Multi-core profile detection, conversion and validation tests
        working-directory: .core
        # with_quic: converted sing-box profiles carry Hysteria2 nodes.
        run: go test -tags with_quic,with_utls -ldflags=-checklinkname=0 ./experimental/libbox -run '^Test(DetectCoreConfig|Convert|CheckMihomo|CheckXray|ResolveProfileCore|SubscriptionURL|DropUnbuiltTunStack|ConvertCoreShareLinksEnabled|CoreProfileStats|CoreInternals|CoreConfigArray|CoreDefaultLogLevel|CoreGeo|CoreMemory|CoreRouting)' -count=1 -v
      - name: HTTP/MITM, profile rewrite, JavaScript, storage and route tests
        working-directory: .core
        run: |
          go test -race ./experimental/httpdebug -count=1 -timeout=5m
          go test -ldflags=-checklinkname=0 ./route -run '^TestBboxHTTPDebug' -count=1 -timeout=5m
  kernels:
    # fk-box's own module core/ (fk-core) and the official kernels built from
    # unmodified upstream tags (docs/kernel-isolation.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: versions
        run: echo "go=$(sed -n 's/^GO_VERSION=go//p' version.properties | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache-dependency-path: |
            core/go.mod
            core/tools/xrayshare/go.sum
      - name: fk-core never links a kernel (go list -deps)
        env:
          GOTOOLCHAIN: local
        run: python3 tools/check_kernel_isolation.py
      - name: fk-core format, vet and tests
        working-directory: core
        env:
          GOTOOLCHAIN: local
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          GOOS=android GOARCH=arm64 go vet ./...
          go test -race -count=1 ./...
      - name: fk-core answers hello over stdio
        working-directory: core
        env:
          GOTOOLCHAIN: local
        run: |
          go build -o "$RUNNER_TEMP/fk-core" ./cmd/fk-core
          "$RUNNER_TEMP/fk-core" -version
          printf '%s\n' \
            '{"id":1,"method":"version","args":{}}' \
            '{"id":2,"method":"hello","args":{"protocolVersion":1}}' \
            '{"id":3,"method":"version","args":{}}' \
            | "$RUNNER_TEMP/fk-core" -dir "$RUNNER_TEMP/fk-core-dir" | tee "$RUNNER_TEMP/fk-core.out"
          grep -q '"id":1,"error":"protocol: send hello first"' "$RUNNER_TEMP/fk-core.out"
          grep -q '"id":2,"result":{"protocolVersion":1' "$RUNNER_TEMP/fk-core.out"
          grep -q '"id":3,"result":{"fkCore"' "$RUNNER_TEMP/fk-core.out"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            ndk;28.0.13004108
      - name: Official Xray and mihomo build unmodified (git status --porcelain empty), with fk-core and xrayshare
        env:
          GOTOOLCHAIN: local
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          KERNEL_SRC="$RUNNER_TEMP/kernel-src" tools/build_kernels.sh "$RUNNER_TEMP/kernels" arm64 --no-libbox
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Compose source guards
        run: python3 tools/verify_newui.py
      - name: UI protocol (protocol/methods.json against Go, Kotlin and Rust)
        run: python3 tools/protocol.py check
      - name: Client isolation (no clients/<a> -> clients/<b> references)
        run: python3 tools/check_isolation.py
