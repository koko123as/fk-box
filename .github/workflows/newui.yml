name: Core and source validation

on:
  push:
    branches: [main]
    paths:
      # shared: everything the clients build on (keep in sync across build-*.yml / newui.yml)
      - 'core/**'
      - 'protocol/**'
      - 'ui/**'
      - 'tools/**'
      - 'version.properties'
      - 'flclash-manifest.json'
      - 'licenses/**'
      - '.github/actions/**'
      - 'clients/**'
      - '.github/workflows/newui.yml'
      # docs-only changes never build
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      # shared: everything the clients build on (keep in sync across build-*.yml / newui.yml)
      - 'core/**'
      - 'protocol/**'
      - 'ui/**'
      - 'tools/**'
      - 'version.properties'
      - 'flclash-manifest.json'
      - 'licenses/**'
      - '.github/actions/**'
      - 'clients/**'
      - '.github/workflows/newui.yml'
      # docs-only changes never build
      - '!**/*.md'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # The sing-box API fk-core serves for Xray and mihomo, checked against the
    # pinned sing-box tag.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: versions
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '\r')
          core_version=$(sed -n 's/^CORE_VERSION=//p' version.properties | tr -d '\r')
          echo "core_version=${core_version:-$version}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: SagerNet/sing-box
          ref: v${{ steps.versions.outputs.core_version }}
          path: .core
          persist-credentials: false
      - name: Command service coverage and app libbox calls
        run: python3 tools/verify_multicore.py
  kernels:
    # fk-box's own module core/ (fk-core) and the official kernels built from
    # unmodified upstream tags (docs/kernel-isolation.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: versions
        run: echo "go=$(sed -n 's/^GO_VERSION=go//p' version.properties | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache-dependency-path: |
            core/go.mod
            core/tools/xrayshare/go.sum
      - name: fk-core never links a kernel (go list -deps)
        env:
          GOTOOLCHAIN: local
        run: python3 tools/check_kernel_isolation.py
      - name: fk-core format, vet and tests
        working-directory: core
        env:
          GOTOOLCHAIN: local
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          GOOS=android GOARCH=arm64 go vet ./...
          go test -race -count=1 ./...
      - name: fk-core runs the official mihomo and checks Xray configurations (upstream linux builds)
        working-directory: core
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          xray=$(sed -n 's/^XRAY_VERSION=//p' ../version.properties | tr -d '\r')
          mihomo=$(sed -n 's/^MIHOMO_VERSION=//p' ../version.properties | tr -d '\r')
          dir="$RUNNER_TEMP/kernels-linux"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/xray.zip" "https://github.com/XTLS/Xray-core/releases/download/v$xray/Xray-linux-64.zip"
          unzip -oq "$dir/xray.zip" xray -d "$dir" && mv "$dir/xray" "$dir/libxray.so"
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v$mihomo/mihomo-linux-amd64-v$mihomo.gz" | gunzip > "$dir/libmihomo.so"
          chmod +x "$dir/libxray.so" "$dir/libmihomo.so"
          FKBOX_KERNEL_DIR="$dir" go test -count=1 -run 'TestService|TestXrayConfigChecksWithKernel' -v ./fk/
      - name: fk-core answers hello over stdio
        working-directory: core
        env:
          GOTOOLCHAIN: local
        run: |
          go build -o "$RUNNER_TEMP/fk-core" ./cmd/fk-core
          "$RUNNER_TEMP/fk-core" -version
          printf '%s\n' \
            '{"id":1,"method":"version","args":{}}' \
            '{"id":2,"method":"hello","args":{"protocolVersion":1}}' \
            '{"id":3,"method":"version","args":{}}' \
            | "$RUNNER_TEMP/fk-core" -dir "$RUNNER_TEMP/fk-core-dir" | tee "$RUNNER_TEMP/fk-core.out"
          grep -q '"id":1,"error":"protocol: send hello first"' "$RUNNER_TEMP/fk-core.out"
          grep -q '"id":2,"result":{"protocolVersion":1' "$RUNNER_TEMP/fk-core.out"
          grep -q '"id":3,"result":{"fkCore"' "$RUNNER_TEMP/fk-core.out"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            ndk;28.0.13004108
      - name: Official Xray and mihomo build unmodified (git status --porcelain empty), with fk-core and xrayshare
        env:
          GOTOOLCHAIN: local
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          KERNEL_SRC="$RUNNER_TEMP/kernel-src" tools/build_kernels.sh "$RUNNER_TEMP/kernels" arm64 --no-libbox
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Compose source guards
        run: python3 tools/verify_newui.py
      - name: UI protocol (protocol/methods.json against Go, Kotlin and Rust)
        run: python3 tools/protocol.py check
      - name: fk-core's Kotlin facade is current and the app reaches fk-core only through it
        run: python3 tools/fkapi.py check
      - name: Client isolation (no clients/<a> -> clients/<b> references)
        run: python3 tools/check_isolation.py
