name: Build Release APK (arm64-v8a)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release (version tag must match this commit)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/newui.yml
  build:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout app
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The version is the publish day (China Standard Time): YYYY.MM.DD, then
      # YYYY.MM.DD.2 and so on for later releases that day; code YYMMDDNN.
      - id: version
        name: Set the release version from the date
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_version.py

      - id: core
        uses: ./.github/actions/build-libbox
        with:
          platform: android/arm64

      - name: Set up Java for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # The UI is Rust + Slint (ui-slint/), built into libfkui.so by cargo-ndk.
      - name: Set up Rust for the Slint UI
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
          cargo install cargo-ndk --version 4.1.2 --locked
          # Slint compiles its Java IME helper at build time.
          echo "ANDROID_JAR=$(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)" >> "$GITHUB_ENV"
          echo "ANDROID_D8_JAR=$(ls -d "$ANDROID_HOME"/build-tools/*/lib/d8.jar | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ui-slint

      - name: Run unit tests
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          ./gradlew :app:testOtherDebugUnitTest -Parm64Only=true \
            --no-daemon --console=plain --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-unit-tests
          path: |
            app/build/reports/tests/testOtherDebugUnitTest/
            app/build/test-results/testOtherDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASS ALIAS_NAME ALIAS_PASS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name (see app.md)"
              exit 1
            fi
          done
          # Decoded outside the checkout, so it can never be committed or
          # packaged; Gradle reads its path from KEYSTORE_FILE.
          umask 077
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          echo "KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          ./gradlew :app:assembleOtherRelease -Parm64Only=true \
            --no-daemon --console=plain --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Verify APK identity, architecture and signature
        run: python3 tools/verify_release.py

      - name: Upload Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FK-box-${{ steps.core.outputs.version }}-arm64-v8a-release
          path: app/build/outputs/apk/other/release/*-arm64-v8a.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.core.outputs.version }}
        run: python3 tools/publish_release.py

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
