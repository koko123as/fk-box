name: Build APK on push (arm64-v8a)

# Builds every push to main: the Rust + Slint UI (ui/, libfkui.so) over
# the Kotlin service layer and the patched core, signed with the release key
# and uploaded as a workflow artifact only. This workflow never creates tags or
# GitHub Releases.
on:
  push:
    branches: [main]
    paths:
      # shared: everything the clients build on (keep in sync across build-*.yml / newui.yml)
      - 'core/**'
      - 'protocol/**'
      - 'ui/**'
      - 'tools/**'
      - 'version.properties'
      - 'flclash-manifest.json'
      - 'licenses/**'
      - '.github/actions/**'
      - 'clients/android/**'
      - '.github/workflows/build-apk.yml'
      # docs-only changes never build
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout app
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Source guards
        run: python3 tools/verify_newui.py

      - id: core
        uses: ./.github/actions/build-libbox
        with:
          platform: android/arm64

      - name: Set up Java for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # Write the Gradle cache from main and the ui/* branches (setup-gradle
          # only writes from the default branch otherwise); others only read.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/ui/') }}
      # clients/android/app/build.gradle.kts downloads the pinned geo data into clients/android/.gradle/geo-assets/<commit>.
      - name: Cache bundled geo data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: clients/android/.gradle/geo-assets
          key: geo-assets-${{ hashFiles('clients/android/app/geo-assets.properties') }}
      # The UI is Rust + Slint (ui/), built into libfkui.so by cargo-ndk.
      - name: Set up Rust for the Slint UI
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable

      # Restored before cargo-ndk is installed, so ~/.cargo/bin (cargo-ndk),
      # the registry/git sources and ui/target come back together.
      # skia-bindings keeps the downloaded Skia prebuilt archive
      # (OUT_DIR/.cache) and its unpacked libraries in its OUT_DIR under
      # ui/target/<triple>/release/build/skia-bindings-*/, which this
      # cache keeps (dependency build outputs survive its cleanup), so a hit
      # neither downloads nor rebuilds Skia. The key follows Cargo.lock (the
      # skia-bindings version) and the rustc version.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ui

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          # Slint compiles its Java IME helper at build time.
          echo "ANDROID_JAR=$(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)" >> "$GITHUB_ENV"
          echo "ANDROID_D8_JAR=$(ls -d "$ANDROID_HOME"/build-tools/*/lib/d8.jar | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Rust UI unit tests (host)
        working-directory: ui
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1-dev
          cargo test --lib

      - name: Run JVM unit tests
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          clients/android/gradlew -p clients/android :app:testOtherDebugUnitTest -Parm64Only=true \
            --no-daemon --console=plain --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-unit-tests
          path: |
            clients/android/app/build/reports/tests/testOtherDebugUnitTest/
            clients/android/app/build/test-results/testOtherDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASS ALIAS_NAME ALIAS_PASS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name (see app.md)"
              exit 1
            fi
          done
          # Decoded outside the checkout, so it can never be committed or
          # packaged; Gradle reads its path from KEYSTORE_FILE.
          umask 077
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          echo "KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          clients/android/gradlew -p clients/android :app:assembleOtherRelease -Parm64Only=true \
            --no-daemon --console=plain --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Verify APK identity, architecture and signature
        run: |
          python3 tools/verify_release.py
          unzip -l clients/android/app/build/outputs/apk/other/release/*-arm64-v8a.apk | grep -E 'lib/arm64-v8a/lib(fkui|box)\.so'

      - name: Upload Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fk-box-${{ steps.core.outputs.version }}-${{ github.sha }}-arm64-v8a-release
          path: clients/android/app/build/outputs/apk/other/release/*-arm64-v8a.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
