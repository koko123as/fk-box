name: Build Debug APK (arm64-v8a)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: false

# fk-box: Rust + Slint UI over the unchanged Kotlin service
# layer and patched core.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout app
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - id: core
        uses: ./.github/actions/build-fkhost

      - name: Set up Java for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # Write the Gradle cache from main and the ui/* branches (setup-gradle
          # only writes from the default branch otherwise); others only read.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/ui/') }}
      # apps/android/app/build.gradle.kts downloads the pinned geo data into apps/android/.gradle/geo-assets/<commit>.
      - name: Cache bundled geo data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/android/.gradle/geo-assets
          key: geo-assets-${{ hashFiles('apps/android/app/geo-assets.properties') }}
      # The UI is Rust + Slint (crates/client-ui/), built into libfkui.so by cargo-ndk.
      - name: Set up Rust for the Slint UI
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable

      # Restored before cargo-ndk is installed, so ~/.cargo/bin (cargo-ndk),
      # the registry/git sources and target/ come back together.
      # skia-bindings keeps the downloaded Skia prebuilt archive
      # (OUT_DIR/.cache) and its unpacked libraries in its OUT_DIR under
      # target/<triple>/release/build/skia-bindings-*/, which this
      # cache keeps (dependency build outputs survive its cleanup), so a hit
      # neither downloads nor rebuilds Skia. The key follows Cargo.lock (the
      # skia-bindings version) and the rustc version.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The Cargo workspace at the repository root (target/).
          workspaces: .

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Rust UI unit tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1-dev
          cargo test --workspace --lib

      - name: Source guards
        run: python3 scripts/verify_newui.py

      - name: Build debug APK
        working-directory: apps/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          # Slint compiles its Java IME helper at build time.
          export ANDROID_JAR="$(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)"
          export ANDROID_D8_JAR="$(ls -d "$ANDROID_HOME"/build-tools/*/lib/d8.jar | sort -V | tail -1)"
          echo "ANDROID_JAR=$ANDROID_JAR ANDROID_D8_JAR=$ANDROID_D8_JAR"
          ./gradlew :app:assembleOtherDebug -Parm64Only=true \
            --no-daemon --console=plain --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Report APK size
        run: |
          for apk in apps/android/app/build/outputs/apk/other/debug/*.apk; do
            echo "- $(basename "$apk"): $(stat -c %s "$apk") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fk-box-${{ steps.core.outputs.version }}-${{ github.sha }}-arm64-v8a-debug
          path: apps/android/app/build/outputs/apk/other/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: JVM unit tests
        working-directory: apps/android
        run: |
          ./gradlew :app:testOtherDebugUnitTest -Parm64Only=true \
            --no-daemon --console=plain --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/test-results/
          retention-days: 7
