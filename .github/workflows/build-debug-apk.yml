name: Build Debug APK (arm64-v8a)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/newui.yml
  build:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout app
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - id: core
        uses: ./.github/actions/build-libbox
        with:
          platform: android/arm64

      - name: Set up Java for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download validated Flutter libraries
        uses: actions/download-artifact@v5
        with:
          name: flutter-aar-arm64
          path: flutter/build/host/outputs/repo

      - name: Build debug APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          ./gradlew :app:assembleOtherDebug -Parm64Only=true \
            --no-daemon --console=plain --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: B-box-${{ steps.core.outputs.version }}-arm64-v8a-debug
          path: app/build/outputs/apk/other/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
