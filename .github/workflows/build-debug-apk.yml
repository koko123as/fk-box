name: Build Debug APK (arm64-v8a)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: false

# FK-box with FlClash's Flutter UI (flutter/); flclash-ui.yml builds the same
# on every push with the source diff, this one is for manual runs.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout app
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - id: core
        uses: ./.github/actions/build-libbox
        with:
          platform: android/arm64

      - name: Set up Java for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The UI is FlClash's Flutter app in flutter/ (see flclash.md).
      - name: Set up FlClash's Flutter UI
        uses: ./.github/actions/setup-flutter-ui

      - name: Build debug APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          ./gradlew :app:assembleOtherDebug -Parm64Only=true -Ptarget-platform=android-arm64 \
            --no-daemon --console=plain --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Report APK size
        run: |
          for apk in app/build/outputs/apk/other/debug/*.apk; do
            echo "- $(basename "$apk"): $(stat -c %s "$apk") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FK-box-${{ steps.core.outputs.version }}-${{ github.sha }}-arm64-v8a-debug
          path: app/build/outputs/apk/other/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: JVM unit tests
        run: |
          ./gradlew :app:testOtherDebugUnitTest -Parm64Only=true \
            --no-daemon --console=plain --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
