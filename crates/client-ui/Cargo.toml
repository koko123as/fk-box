[package]
# The gettext domain of the bundled translations is the package name
# (i18n/zh/LC_MESSAGES/fkbox-client-ui.po).
name = "fkbox-client-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "FK-box user interface in Slint: the component tree (ui/), translations, Material 3 color schemes and fonts. No page logic; the platform shells (apps/android/native) drive it."

[lib]
path = "src/lib.rs"

[dependencies]
# No default backends: on Android the platform is the GameActivity backend in apps/android/native.
slint = { workspace = true }
# The font spec file (src/fonts.rs).
serde_json = { workspace = true }
# Material Color Utilities (spec 2021, as com.google.android.material.color.utilities).
material-colors = "=0.5.0"
# System font files are mapped, not read into the heap (src/fonts.rs).
memmap2 = "0.9"

[target.'cfg(target_os = "android")'.dependencies]
log = "0.4"
# PNG decoding for app icons (PackageIcon) rendered by the native side.
i-slint-core = { version = "=1.19.0", default-features = false, features = ["std", "image-decoders", "shared-parley"] }

# Host builds (unit tests) need the same image support the Android backend enables.
[target.'cfg(not(target_os = "android"))'.dependencies]
i-slint-core = { version = "=1.19.0", default-features = false, features = ["std", "image-decoders", "svg", "shared-parley"] }

[build-dependencies]
slint-build = { workspace = true }
