[package]
name = "fkbox-client-core"
version = "0.2.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "FK-box platform-neutral client layer: the Host contract between the UI and a platform shell, the client store (settings, profile metadata, remote servers, interface preferences) with its one-time import from the Android app's Room databases, subscriptions (provider headers, update policy, the profile save flow), the routing rule model, the geo resource policy and the service settings."

[lib]
path = "src/lib.rs"

[dependencies]
# SQLite compiled in, so every platform shell gets the same engine and the
# store never depends on a system libsqlite3.
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Profile revisions (SHA-256 of the content, as the edit forms carry them).
sha2 = "0.10"
