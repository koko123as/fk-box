[package]
name = "fkbox-mobile-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "FK-box platform-neutral mobile session: the host contract (NativeHost), the process's client store session with its one-time imports, the JSON call surface for the platform host and the command-session plan. No JNI, Slint or Android SDK."

[lib]
path = "src/lib.rs"

[dependencies]
fkbox-client-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Builds the SQLite store of earlier builds in the upgrade tests.
rusqlite = { version = "0.43", features = ["bundled"] }
fkbox-client-core = { workspace = true, features = ["test-support"] }
